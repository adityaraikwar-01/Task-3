<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechNotes – Why Accessibility Matters</title><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><p class="logo">TechNotes</p>
<nav aria-label="Main"><ul>
<li><a href="#main" aria-current="page">Home</a></li><li><a href="#articles">Articles</a></li><li><a href="#contact">Contact</a></li></ul></nav></header>
<main id="main" tabindex="-1">
<h1>Welcome to TechNotes</h1>
<section id="articles" aria-labelledby="a1"><article>
<h2 id="a1">Why Accessibility Matters</h2>
<p>Over a billion people live with a disability. Accessible sites help everyone.</p>
<button type="button" aria-expanded="false" aria-controls="more">Read more</button>
<p id="more" hidden>Keyboard support, contrast and clear labels all help.</p></article></section>
<section id="contact" aria-labelledby="c1"><h2 id="c1">Contact us</h2>
<form novalidate>
<p><label for="name">Name</label><input id="name" name="name" autocomplete="name" required aria-describedby="name-err"><span id="name-err" class="err"></span></p>
<p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><span id="email-err" class="err"></span></p>
<button type="submit">Send</button></form>
<p id="status" role="status" aria-live="polite"></p></section>
</main>
<footer><p>© 2026 TechNotes</p></footer>
<script src="script.js"></script>
</body></html>
